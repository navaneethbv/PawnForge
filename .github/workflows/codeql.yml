name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '30 8 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            runner: ubuntu-latest
            build: none
          - language: actions
            runner: ubuntu-latest
            build: none
          - language: c-cpp
            runner: ubuntu-latest
            build: none
          - language: swift
            runner: macos-15
            build: manual
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build }}
      - name: Build macOS package for CodeQL
        if: matrix.language == 'swift'
        run: swift build --package-path macos --build-path "$RUNNER_TEMP/codeql-swift" -Xswiftc -warnings-as-errors
      - uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          category: /language:${{ matrix.language }}
